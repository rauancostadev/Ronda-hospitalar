<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f3a">
<title>Ronda Hospitalar</title>
<script>try{var t=localStorage.getItem('rh_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   Ronda Hospitalar — estilos
   Layout: sidebar escura fixa + área de trabalho clara; painel em grade de
   cartões; ronda em fluxo vertical de itens.
   ========================================================================== */

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- tema ---------- */
:root{
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#f7fafb; --ink:#0e2830; --ink2:#46606a; --muted:#6a8089;
  --line:#dce5e8; --line2:#c6d4d9; --grid:#e6edef;
  --brand:#0a6c7d; --brand-h:#085564; --brand-soft:#e1f1f4; --on-brand:#ffffff;
  --side:#0b2f3a; --side-ink:#c9dfe5; --side-active:#14485a; --side-line:#1b4452;
  --ok:#0c7a3a; --ok-bg:#e3f4ea; --warn:#855400; --warn-bg:#fdf0d0; --bad:#b42323; --bad-bg:#fbe5e5; --info:#1c5cab; --info-bg:#e4eefb;
  --s1:#fab219; --s2:#ec835a; --s3:#d03b3b; --s4:#7a1a28;
  --c1:#2a78d6; --good:#0ca30c;
  --shadow:0 1px 2px rgba(14,40,48,.06),0 4px 14px rgba(14,40,48,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1418; --surface:#101d23; --surface2:#142329; --ink:#e7f1f3; --ink2:#a9bec5; --muted:#8aa0a8;
  --line:#22363d; --line2:#2f4850; --grid:#1b2c32;
  --brand:#3bb4c8; --brand-h:#62c8d9; --brand-soft:#12333b; --on-brand:#04222a;
  --side:#0c1d23; --side-ink:#a9c2c9; --side-active:#173a45; --side-line:#1a323a;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#f0b84a; --warn-bg:#33270c; --bad:#ff8585; --bad-bg:#3a1616; --info:#79b0f0; --info-bg:#14263d;
  --s4:#c2465a; --c1:#3987e5; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1418; --surface:#101d23; --surface2:#142329; --ink:#e7f1f3; --ink2:#a9bec5; --muted:#8aa0a8;
  --line:#22363d; --line2:#2f4850; --grid:#1b2c32;
  --brand:#3bb4c8; --brand-h:#62c8d9; --brand-soft:#12333b; --on-brand:#04222a;
  --side:#0c1d23; --side-ink:#a9c2c9; --side-active:#173a45; --side-line:#1a323a;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#f0b84a; --warn-bg:#33270c; --bad:#ff8585; --bad-bg:#3a1616; --info:#79b0f0; --info-bg:#14263d;
  --s4:#c2465a; --c1:#3987e5; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em} h3{font-size:14px} small{color:var(--muted);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.2} .brand span{font-size:11.5px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid #fff}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--s1)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--side-line);padding-top:12px}
.me{display:flex;gap:10px;align-items:center;padding:4px 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--side-active);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.me b{display:block;color:#fff;font-size:13px;line-height:1.2} .me span{font-size:11.5px;opacity:.75}
.side-foot .row{display:flex;gap:6px}
.ghost-d{all:unset;box-sizing:border-box;flex:1;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;border-radius:8px;border:1px solid var(--side-line);cursor:pointer;font-size:12.5px;color:var(--side-ink)}
.ghost-d:hover{background:var(--side-active)} .ghost-d:focus-visible{outline:2px solid #fff}
main{min-width:0;padding:22px clamp(16px,3vw,34px) 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top p{margin:2px 0 0;color:var(--ink2)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--line2);padding:10px 14px;border-radius:8px;margin-bottom:14px}

/* ---------- controles ---------- */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)} .btn.pri:hover{background:var(--brand-h)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:2px solid var(--brand-soft)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;padding:10px 16px;cursor:pointer;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--brand)}

/* ---------- cartões e indicadores ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline} .card h3 small{font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em;display:block}
.kpi strong{display:block;font-size:30px;line-height:1.15;margin:4px 0 2px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{display:block}
.kpi .good{color:var(--ok)} .kpi .badc{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:10px}
.empty b{display:block;color:var(--ink2);margin-bottom:2px}

/* ---------- gráficos ---------- */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-r{display:grid;grid-template-columns:minmax(80px,38%) 1fr 44px;gap:10px;align-items:center}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-size:13px}
.hb-t{height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.seg-bar{display:flex;height:16px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.seg-bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center} .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
#ch-line{width:100%}
#ch-line svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12.5px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip[hidden]{display:none}

/* ---------- tabelas e listas ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer} tbody tr[data-act]:hover{background:var(--surface2)}
td small{display:block}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-aberta{background:var(--bad-bg);color:var(--bad)} .st-tratamento{background:var(--warn-bg);color:var(--warn)} .st-resolvida{background:var(--ok-bg);color:var(--ok)}
.pill.late{background:var(--warn-bg);color:var(--warn)} .pill.okp{background:var(--ok-bg);color:var(--ok)} .pill.off{background:var(--grid);color:var(--muted)} .pill.inf{background:var(--info-bg);color:var(--info)}
.sev{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;white-space:nowrap}
.sev b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#1a1200;font-size:11px}
.sev.s1 b{background:var(--s1)} .sev.s2 b{background:var(--s2)} .sev.s3 b{background:var(--s3);color:#fff} .sev.s4 b{background:var(--s4);color:#fff}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--grid);display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);flex:none}
img.thumb{display:block}
.ncs{display:flex;flex-direction:column;gap:10px}
.nc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.nc:hover{background:var(--surface2)}
.nc.s1{border-left-color:var(--s1)} .nc.s2{border-left-color:var(--s2)} .nc.s3{border-left-color:var(--s3)} .nc.s4{border-left-color:var(--s4)}
.nc b{display:block} .nc p{margin:2px 0 4px;color:var(--ink2);overflow-wrap:anywhere}
.nc .meta{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.nc .right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* ---------- ronda ---------- */
.salas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sala{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.sala:hover{border-color:var(--brand)}
.sala .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sala b{font-size:15px} .sala .f{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.rhead{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prog{flex:1;min-width:180px}
.prog .bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--brand);transition:width .2s}
.sala-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--brand)}
.sala-h:first-of-type{margin-top:8px}
.sala-h h2{font-size:17px} .sala-h small{font-size:12.5px}
.grp{margin-bottom:16px}
.grp>.gh{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0}
.grp>.gh .t{flex:1;min-width:0} .grp>.gh b{display:block;overflow-wrap:anywhere}
.grp>.items{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface)}
.grp.noitems>.gh{border-radius:12px}
.it{padding:12px 14px;border-bottom:1px solid var(--line)} .it:last-child{border-bottom:0}
.it-row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.it-t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:40px;font-weight:600;font-size:13px;border-right:1px solid var(--line2);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].c{background:#0c7a3a;color:#fff}
.seg button[aria-pressed="true"].n{background:#b42323;color:#fff}
.seg button[aria-pressed="true"].a{background:#5d727a;color:#fff}
.ncp{margin-top:10px;background:var(--bad-bg);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ncp .full{grid-column:1/-1}
.ncp .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ncp .ph img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.it.miss{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-bg)}
.cal{font-size:12px}
/* orientação da não conformidade (alerta ao inspetor) */
.orient{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-left-width:5px;border-radius:8px;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
.orient svg{margin-top:2px}
.orient b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
details.guide{margin-bottom:12px} details.guide summary{cursor:pointer;font-weight:600}
.guide-l{display:grid;gap:8px;margin-top:10px}
.guide-l div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.guide-l p{margin:2px 0 0;color:var(--ink2)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(5,20,26,.55);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.mod{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto 0}
.mod.wide{max-width:820px}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:18px 20px;display:grid;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.pw:not(.show){-webkit-text-security:disc}
.chk{display:flex;gap:8px;align-items:center;font-weight:500} .chk input{width:18px;height:18px}
.chk-list{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;max-height:260px;overflow-y:auto;display:grid;gap:4px;background:var(--surface)}
.chk-list .gt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px;font-weight:600}
.chk-list .chk{font-weight:400;padding:3px 0}
.irow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.irow input{flex:1}
.ic-btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--ink2)}
.ic-btn:hover{background:var(--surface2)}
.big-img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--grid)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px} .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- login / primeiro acesso ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-l{background:var(--side);color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-l h2{font-size:clamp(26px,3.2vw,38px);font-weight:600;letter-spacing:-.02em;max-width:16ch;line-height:1.15}
.auth-l p{max-width:44ch;color:var(--side-ink);margin:14px 0 0}
.auth-l ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;color:var(--side-ink)} .auth-l li{display:flex;gap:10px;align-items:center}
.auth-r{display:grid;place-items:center;padding:32px 16px}
.auth-card{width:100%;max-width:380px;display:grid;gap:16px}
.err{color:var(--bad);font-weight:500;min-height:20px}
.prog-seed{height:8px;background:var(--grid);border-radius:99px;overflow:hidden} .prog-seed i{display:block;height:100%;background:var(--brand);width:0}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
  .brand{border:0;margin:0;padding:0}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%;padding-bottom:2px} .nav button{white-space:nowrap;padding:9px 12px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brand)}
  .side-foot{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;align-items:center} .me div{display:none}

<!-- Núcleo (a ordem importa): dados, utilitários, estado, permissões, segurança, imagens, interface, acesso aos dados -->
<script>
/* ==========================================================================
   Camada de dados
   - Sem configuração (js/config.js vazio): guarda tudo neste navegador (IndexedDB).
   - Com RONDA_CONFIG preenchido: usa o banco compartilhado (Supabase) protegido por
     um código de acesso da equipe, via funções SQL (veja supabase-setup.sql).
   API exposta: window.RH.store  →  { mode, open(), volatile(), exportJSON(), importJSON(), wipeAll(), changeCode() }
   `open()` devolve um objeto com collection(nome) e doc('colecao/id') no estilo Firestore.
   ========================================================================== */
(()=>{
const RH=window.RH=window.RH||{};
const CFG=window.RONDA_CONFIG||{},RAWURL=String(CFG.supabaseUrl||'').trim(),KEY=String(CFG.supabaseKey||'').trim(),REMOTE=!!(RAWURL||KEY);

/* aceita só o endereço do projeto; remove caminhos colados por engano (/rest/v1, link do painel etc.) */
function normUrl(u){if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{const x=new URL(u),m=/(^|\.)supabase\.com$/.test(x.hostname)&&x.pathname.match(/\/project\/([a-z0-9]+)/i);return m?'https://'+m[1]+'.supabase.co':x.origin}catch(e){return ''}}
const BASE=normUrl(RAWURL);
function keyProblem(){
  if(!KEY)return 'A chave (supabaseKey) não foi preenchida em js/config.js.';
  let role='';try{if(KEY.startsWith('eyJ'))role=JSON.parse(atob(KEY.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){}
  if(KEY.startsWith('sb_secret_')||role==='service_role')return 'Esta é a chave SECRETA do projeto e nunca deve ficar em um site. Use a chave anon (ou publishable) em Project Settings → API.';
  return ''}

const DB='ronda-hospitalar',ST='docs',mem=new Map(),subs=new Set();
let idb=null,bc=null,volatile=false,code='';
const clone=o=>JSON.parse(JSON.stringify(o));
const err=(c,m)=>Object.assign(new Error(m),{code:c,message:m});
const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let pend=false;const notify=()=>{if(pend)return;pend=true;queueMicrotask(()=>{pend=false;subs.forEach(s=>s.run())})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- modo local (IndexedDB) ---------- */
const L={
  open(){return new Promise(res=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'p'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
  tx(mode,fn){return new Promise((res,rej)=>{if(!idb)return res();const t=idb.transaction(ST,mode);fn(t.objectStore(ST));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async loadAll(){mem.clear();if(!idb)return;await new Promise((res,rej)=>{const r=idb.transaction(ST).objectStore(ST).getAll();r.onsuccess=()=>{r.result.forEach(x=>mem.set(x.p,x.d));res()};r.onerror=()=>rej(r.error)})},
  async persist(p,d){if(d===null)await L.tx('readwrite',s=>s.delete(p));else await L.tx('readwrite',s=>s.put({p,d}));try{bc&&bc.postMessage(1)}catch(e){}},
  async init(){idb=await L.open();if(!idb){volatile=true;console.warn('IndexedDB indisponível: dados só ficam na memória desta aba.')}
    try{await L.loadAll()}catch(e){console.error(e)}
    try{bc=new BroadcastChannel(DB);bc.onmessage=async()=>{try{await L.loadAll();notify()}catch(e){}}}catch(e){}}
};

/* ---------- modo compartilhado (Supabase) ---------- */
let badge=null;
function status(ok,msg){
  if(ok){if(badge){badge.remove();badge=null}return}
  if(!badge){badge=document.createElement('div');badge.setAttribute('role','status');badge.style.cssText='position:fixed;left:12px;bottom:12px;z-index:95;background:var(--warn-bg,#fdf0d0);color:var(--warn,#855400);border:1px solid var(--line2,#ccc);padding:8px 12px;border-radius:10px;font:500 13px var(--font,system-ui);box-shadow:0 4px 14px rgba(0,0,0,.2)';document.body.appendChild(badge)}
  badge.textContent=msg||'Sem conexão com o servidor. Tentando novamente…'}
async function rpc(fn,args){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000),h={'Content-Type':'application/json',apikey:KEY};
  if(KEY.startsWith('eyJ'))h.Authorization='Bearer '+KEY;
  let r;try{r=await fetch(`${BASE}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify({p_code:code,...args}),signal:ctl.signal})}
  catch(e){throw Object.assign(err('unavailable','Sem conexão com o servidor.'),{net:true})}finally{clearTimeout(t)}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||txt||('HTTP '+r.status);throw Object.assign(err(/codigo_invalido/.test(m)?'bad_code':'unavailable',m),{status:r.status})}
  return j}
function overlay(html){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:100;background:var(--bg,#f2f5f6);color:var(--ink,#0e2830);display:grid;place-items:center;padding:16px;font:14px/1.5 var(--font,system-ui)';
  o.innerHTML=`<div style="width:100%;max-width:400px;display:grid;gap:14px;background:var(--surface,#fff);border:1px solid var(--line,#dce5e8);border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)">${html}</div>`;document.body.appendChild(o);return o}
function askCode(msg){return new Promise(res=>{
  const o=overlay(`<h1 style="margin:0;font-size:20px">Código de acesso da equipe</h1><p style="margin:0;color:var(--ink2,#46606a)">Digite o código fornecido pelo administrador para abrir a base de dados compartilhada. Ele fica salvo neste aparelho.</p>
  <form id="rh-code" style="display:grid;gap:12px"><input id="rh-code-i" type="password" autocomplete="off" required placeholder="Código de acesso" style="width:100%;padding:10px 12px;border:1px solid var(--line2,#c6d4d9);border-radius:8px;background:var(--surface,#fff);color:inherit;font:inherit;min-height:40px"><div role="alert" style="color:var(--bad,#b42323);font-weight:500;min-height:20px">${msg||''}</div>
  <button style="background:var(--brand,#0a6c7d);color:var(--on-brand,#fff);border:0;border-radius:8px;padding:10px;font:600 14px var(--font,system-ui);min-height:40px;cursor:pointer">Continuar</button></form>`);
  const i=o.querySelector('#rh-code-i');i.focus();o.querySelector('form').onsubmit=e=>{e.preventDefault();o.remove();res(i.value.trim())}})}
function fatal(msg){return new Promise(res=>{const o=overlay(`<h1 style="margin:0;font-size:20px">Não foi possível conectar</h1><p style="margin:0;color:var(--ink2,#46606a)">${msg}</p><button style="background:var(--brand,#0a6c7d);color:var(--on-brand,#fff);border:0;border-radius:8px;padding:10px;font:600 14px var(--font,system-ui);min-height:40px;cursor:pointer">Tentar novamente</button>`);o.querySelector('button').onclick=()=>{o.remove();res()}})}
function explain(e){
  const m=String(e.message||'');
  if(e.net)return 'Verifique sua internet e tente de novo.';
  if(/Invalid path|Invalid URL|Not Found/i.test(m)&&!/function/i.test(m))return 'A URL do projeto parece incorreta. Use apenas o endereço no formato https://xxxxxxxx.supabase.co (Supabase → Project Settings → API → Project URL).';
  if(e.status===401||e.status===403||/Invalid API key|JWT|apikey/i.test(m))return 'A chave do projeto foi recusada. Copie a chave anon (ou publishable) em Supabase → Project Settings → API.';
  if(/Could not find the function|PGRST202|schema cache/i.test(m))return 'O script supabase-setup.sql ainda não foi executado neste projeto. Rode-o no SQL Editor do Supabase e tente de novo.';
  return 'O servidor recusou a conexão ('+esc(m)+'). Confira a URL e a chave em js/config.js e se o script supabase-setup.sql foi executado.'}
async function authenticate(msg){
  for(;;){
    const kp=keyProblem();if(!BASE){await fatal('A URL em js/config.js (supabaseUrl) está vazia ou inválida. Use o formato https://xxxxxxxx.supabase.co.');continue}
    if(kp){await fatal(esc(kp));continue}
    if(!code){try{code=localStorage.getItem('rh_code')||''}catch(e){}}
    if(!code){try{await rpc('rh_check',{})}catch(e){if(e.code!=='bad_code'){await fatal(explain(e));continue}}
      code=await askCode(msg);msg=''}
    try{await rpc('rh_check',{});try{localStorage.setItem('rh_code',code)}catch(e){}return}
    catch(e){
      if(e.code==='bad_code'){code='';try{localStorage.removeItem('rh_code')}catch(x){}msg='Código incorreto. Tente novamente.';continue}
      await fatal(explain(e))}
  }}
let since=0,polling=false,pollT=null;const pendingPaths=new Map();
async function pull(){
  if(polling)return;polling=true;
  try{let changed=false,from=since>0?Math.max(1,since-100):0;
    for(;;){const rows=await rpc('rh_pull',{p_since:from,p_fotos:false})||[];
      for(const r of rows){if(r.seq>since)since=r.seq;from=r.seq;if(pendingPaths.has(r.p))continue;
        if(r.deleted){if(mem.delete(r.p))changed=true}
        else{const o=mem.get(r.p);if(JSON.stringify(o)!==JSON.stringify(r.d)){mem.set(r.p,r.d);changed=true}}}
      if(rows.length<1000)break}
    status(true);if(changed)notify();
  }catch(e){
    if(e.code==='bad_code'){code='';try{localStorage.removeItem('rh_code')}catch(x){}clearInterval(pollT);await authenticate('O código de acesso mudou. Digite o novo código.');since=0;mem.clear();polling=false;await pull();pollT=setInterval(tick,4000);return}
    status(false)}
  finally{polling=false}}
const tick=()=>{if(!document.hidden)pull()};
let q=[],timer=null,flushing=false;
const inc=p=>pendingPaths.set(p,(pendingPaths.get(p)||0)+1),dec=p=>{const n=(pendingPaths.get(p)||1)-1;if(n)pendingPaths.set(p,n);else pendingPaths.delete(p)};
function enqueue(p,d){return new Promise((res,rej)=>{q.push({p,d,res,rej});inc(p);if(!timer)timer=setTimeout(flush,25)})}
async function flush(){
  timer=null;if(flushing){timer=setTimeout(flush,40);return}flushing=true;
  try{while(q.length){const batch=[];let size=0;
      while(q.length&&batch.length<50&&(!batch.length||size<500000)){const it=q.shift();batch.push(it);size+=it.d?JSON.stringify(it.d).length:20}
      let lastErr=null;
      for(let k=0;k<3;k++){try{await rpc('rh_put_many',{p_items:batch.map(i=>({p:i.p,d:i.d}))});lastErr=null;break}catch(e){lastErr=e;if(e.code==='bad_code'||e.status===400||e.status===413)break;await sleep(600*(k+1))}}
      batch.forEach(i=>{dec(i.p);lastErr?i.rej(lastErr):i.res()});
      if(lastErr)status(false,lastErr.net?undefined:'Não foi possível salvar no servidor.');
    }}finally{flushing=false}}
const R={
  async init(){await authenticate('');await pull();pollT=setInterval(tick,4000);document.addEventListener('visibilitychange',tick);addEventListener('online',tick)},
  persist:(p,d)=>enqueue(p,d)
};
const B=REMOTE?R:L,persist=(p,d)=>B.persist(p,d);

/* ---------- API no estilo Firestore ---------- */
const snap=(p,d)=>({id:p.slice(p.lastIndexOf('/')+1),exists:d!==undefined,data:()=>d===undefined?undefined:clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
const merge=(old,d)=>{const v={...old};for(const[k,x]of Object.entries(clone(d))){if(x&&x.__delete__)delete v[k];else v[k]=x}return v};
async function write(p,next){
  const prev=mem.get(p);
  if(next===null)mem.delete(p);else mem.set(p,next);notify();
  try{await persist(p,next)}catch(e){if(prev===undefined)mem.delete(p);else mem.set(p,prev);notify();throw e}}
function docRef(p){
  return{id:p.slice(p.lastIndexOf('/')+1),path:p,
    async get(){if(REMOTE&&p.startsWith('fotos/')&&!mem.has(p)){const d=await rpc('rh_get',{p_path:p});if(d)mem.set(p,d)}return snap(p,mem.get(p))},
    async set(d){if(!d||typeof d!=='object')throw err('invalid_argument','corpo inválido');await write(p,clone(d))},
    async update(d){if(!mem.has(p))throw err('not_found','documento não existe');await write(p,merge(mem.get(p),d))},
    async delete(){await write(p,null)},
    onSnapshot(f){const s={run:()=>f(snap(p,mem.get(p)))};subs.add(s);setTimeout(s.run,0);return()=>subs.delete(s)}};
}
function query(col,o,l,w){
  const q={orderBy(f,d){return query(col,[f,d||'asc'],l,w)},limit(n){return query(col,o,n,w)},where(f,op,v){return query(col,o,l,[...w,[f,op,v]])},
    rows(){let r=[];mem.forEach((d,p)=>{const[c,id]=split(p);if(c===col)r.push([id,d])});
      w.forEach(([f,op,v])=>{r=r.filter(([,d])=>op==='=='?d[f]===v:op==='!='?d[f]!==v:op==='<'?d[f]<v:op==='<='?d[f]<=v:op==='>'?d[f]>v:op==='>='?d[f]>=v:true)});
      if(o){const[f,dir]=o;r.sort((a,b)=>{const x=a[1][f],y=b[1][f];return((x==null)-(y==null))||(x>y?1:x<y?-1:0)*(dir==='desc'?-1:1)})}else r.sort((a,b)=>a[0]<b[0]?-1:1);
      if(l)r=r.slice(0,l);return r},
    async get(){const r=q.rows().map(([id,d])=>snap(col+'/'+id,d));return{docs:r,size:r.length,empty:!r.length,docChanges:()=>[],metadata:{}}},
    onSnapshot(f){const s={run:()=>{const r=q.rows().map(([id,d])=>snap(col+'/'+id,d));f({docs:r,size:r.length,empty:!r.length,docChanges:()=>[],metadata:{}})}};subs.add(s);setTimeout(s.run,0);return()=>subs.delete(s)}};
  return q}
const collection=c=>Object.assign(query(c,null,null,[]),{path:c,doc:id=>docRef(c+'/'+(id||Math.random().toString(36).slice(2))),async add(d){const r=this.doc();await r.set(d);return r}});
const api={collection,doc:docRef};

/* ---------- backup / manutenção ---------- */
let started=null;
RH.store={
  mode:REMOTE?'remote':'local',
  volatile:()=>volatile,
  async open(){if(!started)started=B.init();await started;return api},
  async exportJSON(){
    const docs=[...mem.entries()].filter(([p])=>!p.startsWith('fotos/')).map(([p,d])=>({p,d}));
    if(REMOTE){let from=0;for(;;){const rows=await rpc('rh_pull',{p_since:from,p_fotos:true})||[];rows.forEach(r=>{from=r.seq;if(!r.deleted&&r.p.startsWith('fotos/'))docs.push({p:r.p,d:r.d})});if(rows.length<1000)break}}
    else mem.forEach((d,p)=>{if(p.startsWith('fotos/'))docs.push({p,d})});
    return JSON.stringify({app:'ronda-hospitalar',v:1,exportadoEm:new Date().toISOString(),docs})},
  async importJSON(txt){const j=JSON.parse(txt);if(j.app!=='ronda-hospitalar'||!Array.isArray(j.docs))throw new Error('Arquivo de backup inválido.');
    let n=0;for(const x of j.docs){if(typeof x.p!=='string'||!x.p.includes('/')||!x.d||typeof x.d!=='object')continue;mem.set(x.p,x.d);await persist(x.p,x.d);n++}notify();return n},
  async wipeAll(){if(REMOTE)throw new Error('Indisponível no modo compartilhado.');const n=mem.size;mem.clear();await L.tx('readwrite',s=>s.clear());notify();return n},
  changeCode(){try{localStorage.removeItem('rh_code')}catch(e){}location.reload()}
};
})();

</script>

moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',

check:'<path d="m5 12 5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',up:'<path d="m6 15 6-6 6 6"/>',dn:'<path d="m6 9 6 6 6-6"/>',

const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

<script>
/* ==========================================================================
   Núcleo · estado da aplicação
   - RH.S   : cópia local dos cadastros e registros (atualizada em tempo real).
   - RH.st  : estado da interface (usuário logado, tela atual, ronda em andamento…).
   - RH.F / NF / HF : filtros do Painel, das Não conformidades e do Histórico.
   - Registros onde cada tela se "pluga": RH.pages, RH.after, RH.ACT,
     RH.ON_CHANGE, RH.ON_INPUT, RH.ON_SUBMIT (despachados em js/app.js).
   - Funções de consulta usadas por várias telas (byId, salasDaRonda, execs).
   ========================================================================== */
(()=>{
const RH=window.RH;

/* coleções do banco → RH.S[coleção]; "config" vira RH.S.cfg */
RH.COLS=['users','salas','equipamentos','checklists','tiposNC','modelos','rondas','ncs','config'];
const S=RH.S={users:[],salas:[],equipamentos:[],checklists:[],tiposNC:[],modelos:[],rondas:[],ncs:[],cfg:{}};

RH.st={
  db:null,          // banco (collection/doc) aberto por RH.store.open()
  me:null,          // usuário logado
  page:'painel',    // tela atual
  screen:'',        // 'noaccess' | 'login' | 'setup' | 'app' (evita redesenhar à toa)
  busy:false,       // true durante operações longas (não redesenha a tela)
  booted:false,     // true quando todas as coleções chegaram pela 1ª vez
  canWrite:true,
  R:null,           // ronda em andamento (preenchimento)
  M:null,           // formulário de cadastro aberto (modal)
  cadTab:'modelos'  // aba atual de Cadastros
};

RH.F={periodo:30,setor:''};
RH.NF={status:'abertas',sev:'',setor:'',q:''};
RH.HF={ronda:'',periodo:30};

RH.pages={};       // pages[nome]() → HTML da tela
RH.after={};       // after[nome]() → roda depois de desenhar a tela (ex.: gráfico)
RH.ACT={};         // ACT[data-act](elemento, evento) → cliques
RH.ON_CHANGE=[];   // funções (el,e) → true se tratou o evento "change"
RH.ON_INPUT=[];    // idem para "input"
RH.ON_SUBMIT={};   // ON_SUBMIT[id do form](form)

/* ---------- consultas ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
RH.byId=byId;
RH.userName=id=>byId(S.users,id)?.nome||'—';

/* salas ativas de uma ronda cadastrada, na ordem salva */
RH.salasDaRonda=m=>(m.salaIds||[]).map(id=>byId(S.salas,id)).filter(s=>s&&s.ativo!==false);

/* Uma "execução" de ronda grava um documento por sala visitada, todos com o mesmo
   execId. Esta função junta os documentos de volta em uma linha por execução.
   Documentos antigos (sem execId) viram uma execução própria. */
RH.execs=list=>{
  const g=new Map();
  list.forEach(r=>{
    const k=r.execId||r.id;let e=g.get(k);
    if(!e){e={id:k,nome:r.modeloNome||r.salaNome||'Ronda',modeloId:r.modeloId||null,ts:r.ts,inspNome:r.inspNome,c:0,nc:0,na:0,docs:[]};g.set(k,e)}
    e.docs.push(r);e.c+=r.c||0;e.nc+=r.nc||0;e.na+=r.na||0;if(r.ts<e.ts)e.ts=r.ts});
  return [...g.values()].map(e=>({...e,pct:e.c+e.nc?Math.round(e.c/(e.c+e.nc)*1000)/10:100})).sort((a,b)=>b.ts-a.ts);
};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · permissões por perfil (um único lugar para todas as regras de acesso)

     Administrador : todas as telas (inclusive Cadastros)
     Gestor        : Painel, Nova ronda, Histórico e Não conformidades
     Inspetor      : SOMENTE "Nova ronda"

   Rondas: uma ronda com responsável só é vista/realizada por ele (o Administrador
   vê e realiza todas); uma ronda "Sem responsável" é vista e realizada por todos
   os usuários com acesso a Nova ronda. Perfil desconhecido é tratado como Inspetor (menor privilégio).

   Atenção: estas regras controlam a INTERFACE. O banco compartilhado é protegido
   apenas pelo código de acesso da equipe (veja LEIA-ME.md).
   ========================================================================== */
(()=>{
const RH=window.RH,st=RH.st;

const PAGES={
  admin:['painel','ronda','historico','ncs','cadastros'],
  gestor:['painel','ronda','historico','ncs'],
  inspetor:['ronda']
};
const pagesOf=()=>PAGES[st.me&&st.me.role]||PAGES.inspetor;
const gerencia=()=>!!st.me&&['admin','gestor'].includes(st.me.role);

RH.access={
  PAGES,
  can:p=>!!st.me&&pagesOf().includes(p),
  firstPage:()=>pagesOf()[0],
  /* a ronda cadastrada `m` aparece para o usuário `u`? */
  rondaVisivel:(m,u)=>!!u&&m.ativo!==false&&(u.role==='admin'||!m.responsavelId||m.responsavelId===u.id),
  canEditNC:()=>gerencia()&&st.canWrite!==false,
  canDeleteNC:()=>gerencia()&&st.canWrite!==false,
  canDeleteRonda:()=>gerencia()&&st.canWrite!==false
};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · senhas
   Guarda apenas o hash PBKDF2-SHA256 (60 mil iterações) com sal por usuário.
   Requer HTTPS (ou localhost), pois usa crypto.subtle.
   ========================================================================== */
(()=>{
const RH=window.RH;
const enc=s=>new TextEncoder().encode(s);
RH.hash=async(pw,salt)=>{
  const k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:60000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · imagens
   Reduz fotos (câmera do celular) antes de gravar: miniatura 160 px e versão
   completa 960 px, ambas em JPEG. Devolve {thumb, full} (data URLs).
   ========================================================================== */
(()=>{
const RH=window.RH;
function readImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
RH.processImg=async file=>({thumb:await readImg(file,160,.6),full:await readImg(file,960,.7)});
})();

</script>
<script>
/* ==========================================================================
   Núcleo · componentes de interface
   toast (aviso), tooltip, janela modal, confirmação em dois toques e os
   pequenos "selos" reutilizados em várias telas (severidade, situação, ativo,
   orientação da não conformidade).
   ========================================================================== */
(()=>{
const RH=window.RH,{$,esc,ic,SEV,ST}=RH,st=RH.st;

/* ---------- aviso rápido ---------- */
RH.toast=(m,k)=>{const t=$('#toast');t.innerHTML=`<div class="toast ${k||''}" role="status">${esc(m)}</div>`;clearTimeout(RH.toast.t);RH.toast.t=setTimeout(()=>t.innerHTML='',3800)};

/* ---------- tooltip (qualquer elemento com data-tip + gráfico) ---------- */
const tip=RH.tip=$('#tip');
RH.showTip=(t,x,y)=>{tip.textContent=t;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,x+12))+'px';tip.style.top=Math.max(8,y-h-12)+'px'};
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)RH.showTip(t.dataset.tip,e.clientX,e.clientY);else if(!e.target.closest||!e.target.closest('#ch-line'))tip.hidden=true});

/* ---------- janela modal ---------- */
RH.modal=(html,wide)=>{$('#modal').innerHTML=`<div class="ov" data-act="ovClose"><div class="mod ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#modal input:not([type=file]),#modal select,#modal textarea');if(f&&matchMedia('(min-width:700px)').matches)f.focus()};
RH.closeModal=()=>{$('#modal').innerHTML='';st.M=null};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').firstChild)RH.closeModal()});

/* ---------- confirmação em dois toques: devolve true no 2º toque (até 3 s depois) ---------- */
let armT;
RH.confirmArm=(fn,msg)=>{if(fn.armed){fn.armed=false;return true}fn.armed=true;RH.toast(msg);clearTimeout(armT);armT=setTimeout(()=>fn.armed=false,3000);return false};

/* ---------- selos ---------- */
RH.sevPill=n=>`<span class="sev s${n}"><b>${n}</b>${SEV[n]||''}</span>`;
RH.stPill=s=>`<span class="pill st-${s}"><i></i>${ST[s]||s}</span>`;
RH.actPill=x=>x.ativo===false?'<span class="pill off">Inativo</span>':'<span class="pill okp">Ativo</span>';
/* alerta com a "Orientação / ação esperada" de um tipo de NC (vazio se não houver texto) */
RH.orientBox=txt=>txt?`<div class="orient" role="note">${ic('alert',18)}<div><b>Orientação / ação esperada</b>${esc(txt)}</div></div>`:'';
})();

</script>
<script>
/* ==========================================================================
   Núcleo · acesso aos dados
   - put / upd / del : gravam, atualizam e apagam documentos ("coleção/id").
   - safe(fn)        : executa uma gravação e mostra uma mensagem clara se falhar.
   - syncAll()       : assina todas as coleções; a cada mudança atualiza RH.S e a tela.
   ========================================================================== */
(()=>{
const RH=window.RH,{S,st,COLS,byId}=RH;

RH.put=(c,id,d)=>st.db.doc(`${c}/${id}`).set(d);
RH.upd=(c,id,d)=>st.db.doc(`${c}/${id}`).update(d);
RH.del=(c,id)=>st.db.doc(`${c}/${id}`).delete();

RH.safe=async fn=>{
  try{return await fn()}
  catch(e){console.error(e);const c=e&&e.code;
    RH.toast(c==='not_found'?'Este registro não existe mais (foi excluído em outro aparelho). Atualize a tela.':c==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível salvar. Verifique a conexão e tente novamente.','bad');
    return undefined}};

const ready={};
function sync(col){
  let q=st.db.collection(col);if(col==='rondas'||col==='ncs')q=q.orderBy('ts','desc').limit(1000);
  q.onSnapshot(s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()}));
    if(col==='config')S.cfg=rows.find(r=>r.id==='main')||{};else S[col]=rows;
    ready[col]=true;onData()},e=>{console.error(col,e);ready[col]=true;onData()});
}
function onData(){
  if(!st.booted){
    if(COLS.every(c=>ready[c])){st.booted=true;
      try{const id=sessionStorage.getItem('rh_uid');const u=id&&byId(S.users,id);if(u&&u.ativo!==false)st.me=u}catch(e){}
      RH.renderRoot()}
    return}
  if(st.me){const u=byId(S.users,st.me.id);if(!u||u.ativo===false){RH.logout();return}st.me=u}
  clearTimeout(onData.t);onData.t=setTimeout(()=>RH.renderRoot(true),200);
}
RH.syncAll=()=>COLS.forEach(sync);
})();

</script>
